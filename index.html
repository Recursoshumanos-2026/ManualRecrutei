<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="Recrutei na Prática — guia do gestor GEX para conduzir processos seletivos com clareza, responsabilidade e evidências." name="description"/>
<title>Recrutei na Prática | Guia do Gestor GEX</title>

<style>
:root{
  --navy:#051629;
  --navy2:#0a2038;
  --blue:#19a9f2;
  --blue2:#246edb;
  --cyan:#55d7ff;
  --white:#fff;
  --ink:#0d1b2a;
  --muted:#667789;
  --line:#dce6ef;
  --bg:#f4f8fb;
  --soft:#eaf6fd;
  --soft2:#edf2ff;
  --warn:#fff7df;
  --ok:#e9fbf3;
  --danger:#fff0f0;
  --shadow:0 18px 48px rgba(5,22,41,.10);
  --radius:22px;
  --radius-sm:14px
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--ink);
  background:var(--bg);
  line-height:1.58
}

a{color:inherit}

button,input{font:inherit}

.progress-top{
  position:fixed;
  left:0;
  top:0;
  height:3px;
  background:linear-gradient(90deg,var(--cyan),var(--blue2));
  width:0;
  z-index:1000
}

.site-header{
  position:sticky;
  top:0;
  z-index:900;
  background:rgba(5,22,41,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08)
}

.header-inner{
  max-width:1440px;
  margin:auto;
  height:76px;
  display:flex;
  align-items:center;
  gap:20px;
  padding:0 28px
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  min-width:max-content
}

.brand img{
  height:44px;
  width:auto;
  border-radius:8px
}

.brand-label{
  font-weight:800;
  color:#fff;
  font-size:14px;
  line-height:1.2
}

.brand-label span{
  display:block;
  color:#6fd8ff;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.12em
}

.search-wrap{
  flex:1;
  display:flex;
  justify-content:center
}

.search{
  width:min(520px,100%);
  position:relative
}

.search input{
  width:100%;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.08);
  color:#fff;
  border-radius:999px;
  padding:12px 44px 12px 17px;
  outline:none
}

.search input::placeholder{
  color:#a8b9c8
}

.search .sicon{
  position:absolute;
  right:16px;
  top:10px;
  color:#87a5ba
}

.top-actions{
  display:flex;
  gap:10px
}

.btn{
  border:0;
  border-radius:999px;
  padding:11px 16px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:.2s
}

.btn:hover{
  transform:translateY(-1px)
}

.btn.primary{
  background:linear-gradient(135deg,var(--cyan),var(--blue2));
  color:#03213a
}

.btn.ghost{
  color:#fff;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12)
}

.layout{
  max-width:1440px;
  margin:auto;
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
  gap:34px;
  padding:30px 28px 80px
}

.sidebar{
  position:sticky;
  top:104px;
  align-self:start;
  height:calc(100vh - 124px);
  overflow:auto;
  padding-right:6px
}

.side-kicker{
  font-size:11px;
  font-weight:900;
  letter-spacing:.13em;
  color:var(--blue2);
  text-transform:uppercase;
  margin:3px 0 10px
}

.side-nav{
  display:grid;
  gap:6px
}

.side-nav a{
  text-decoration:none;
  color:#56697a;
  padding:10px 12px;
  border-radius:10px;
  font-weight:700;
  font-size:14px;
  border-left:3px solid transparent
}

.side-nav a:hover,
.side-nav a.active{
  background:#fff;
  color:var(--ink);
  border-left-color:var(--blue);
  box-shadow:0 5px 16px rgba(5,22,41,.06)
}

.sidebar-note{
  margin-top:20px;
  padding:15px;
  border-radius:14px;
  background:var(--navy);
  color:#dceaf4;
  font-size:12px
}

.sidebar-note strong{
  color:#fff;
  display:block;
  margin-bottom:5px
}

.main{
  min-width:0
}

.hero{
  min-height:560px;
  border-radius:32px;
  background:
    radial-gradient(circle at 78% 14%,rgba(43,170,255,.34),transparent 30%),
    linear-gradient(145deg,#031223 0%,#071c33 56%,#0a3155 100%);
  color:#fff;
  padding:56px;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow)
}

.hero:before{
  content:"";
  position:absolute;
  width:380px;
  height:380px;
  border:1px solid rgba(95,211,255,.2);
  border-radius:50%;
  right:-90px;
  bottom:-150px;
  box-shadow:
    0 0 0 50px rgba(95,211,255,.04),
    0 0 0 100px rgba(95,211,255,.025)
}

.hero-kicker{
  font-size:12px;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#70ddff
}

.hero h1{
  font-size:clamp(44px,7vw,78px);
  line-height:.98;
  letter-spacing:-.055em;
  margin:22px 0 22px;
  max-width:780px
}

.hero p{
  font-size:20px;
  color:#bed2e1;
  max-width:720px;
  margin:0 0 28px
}

.hero .tagline{
  font-weight:900;
  color:#fff;
  margin:28px 0 0
}

.hero-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:32px
}

.hero-mini{
  position:absolute;
  right:48px;
  bottom:42px;
  width:270px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:18px;
  backdrop-filter:blur(10px)
}

.hero-mini span{
  display:block;
  color:#6fd8ff;
  font-weight:900;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.12em
}

.hero-mini strong{
  display:block;
  font-size:22px;
  margin:6px 0 4px
}

.hero-mini p{
  font-size:13px;
  margin:0;
  color:#a9c0d1
}

.section{
  padding:82px 0 0;
  scroll-margin-top:88px
}

.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:26px
}

.eyebrow{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.13em;
  font-weight:900;
  color:var(--blue2)
}

.section h2{
  font-size:clamp(31px,4vw,48px);
  line-height:1.04;
  letter-spacing:-.04em;
  margin:7px 0 8px
}

.section-lead{
  font-size:17px;
  color:var(--muted);
  max-width:800px;
  margin:0
}

.pill{
  font-size:12px;
  font-weight:900;
  padding:8px 11px;
  border-radius:999px;
  background:var(--soft);
  color:#0674b1;
  white-space:nowrap
}

.pill.advanced{
  background:#eef0f5;
  color:#596572
}

.pill.essential{
  background:#ddf6ff;
  color:#046b9f
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:24px 0
}

.quick-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  text-decoration:none;
  transition:.2s;
  box-shadow:0 6px 18px rgba(5,22,41,.04)
}

.quick-card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
  border-color:#9fdcff
}

.qnum{
  display:flex;
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--navy);
  color:#73dbff;
  align-items:center;
  justify-content:center;
  font-weight:900;
  margin-bottom:14px
}

.quick-card strong{
  font-size:17px;
  display:block
}

.quick-card p{
  font-size:13px;
  color:var(--muted);
  margin:6px 0 0
}

.grid-2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:25px;
  box-shadow:0 5px 20px rgba(5,22,41,.04)
}

.card h3{
  font-size:20px;
  margin:0 0 10px
}

.card p{
  color:var(--muted);
  margin:0
}

.culture-card{
  position:relative;
  overflow:hidden
}

.culture-card:after{
  content:"";
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  background:var(--soft);
  right:-25px;
  top:-25px
}

.culture-word{
  font-size:26px;
  font-weight:950;
  letter-spacing:-.035em;
  margin-bottom:6px
}

.culture-action{
  font-size:14px;
  color:var(--muted)
}

.role-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--line)
}

.role-table th,
.role-table td{
  padding:14px 15px;
  text-align:left;
  border-bottom:1px solid var(--line);
  vertical-align:top
}

.role-table th{
  background:var(--navy);
  color:#fff;
  font-size:13px
}

.role-table td:first-child{
  font-weight:800;
  width:22%
}

.role-table tr:last-child td{
  border-bottom:0
}

.path{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  padding:12px 14px;
  background:#f6f9fc;
  border:1px solid var(--line);
  border-radius:12px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:13px;
  margin:14px 0
}

.path span{
  color:#9badbc
}

.callout{
  border-radius:16px;
  padding:17px 18px;
  margin:16px 0;
  border-left:4px solid var(--blue)
}

.callout strong{
  display:block;
  margin-bottom:4px
}

.callout.info{
  background:var(--soft)
}

.callout.warn{
  background:var(--warn);
  border-left-color:#e8a11f
}

.callout.ok{
  background:var(--ok);
  border-left-color:#20a46a
}

.callout.danger{
  background:var(--danger);
  border-left-color:#d95b5b
}

.steps{
  display:grid;
  gap:12px;
  margin:16px 0
}

.step{
  display:grid;
  grid-template-columns:44px 1fr;
  gap:14px;
  align-items:start;
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px
}

.step-num{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(145deg,var(--navy),#163a5d);
  color:#70dcff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:950
}

.step strong{
  display:block;
  margin-bottom:2px
}

.step p{
  margin:0;
  color:var(--muted);
  font-size:14px
}

.accordion{
  display:grid;
  gap:10px
}

details{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden
}

summary{
  list-style:none;
  cursor:pointer;
  padding:18px 20px;
  font-weight:850;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px
}

summary::-webkit-details-marker{
  display:none
}

summary:after{
  content:"+";
  font-size:22px;
  color:var(--blue2);
  font-weight:500
}

details[open] summary:after{
  content:"–"
}

details[open] summary{
  background:#f8fbfd;
  border-bottom:1px solid var(--line)
}

.detail-body{
  padding:20px
}

.detail-body h4{
  margin:20px 0 8px
}

.detail-body h4:first-child{
  margin-top:0
}

.detail-body p{
  color:#556879
}

.detail-body ul{
  padding-left:20px;
  color:#556879
}

.template{
  position:relative;
  background:#07192b;
  color:#dceaf4;
  border-radius:18px;
  padding:22px;
  white-space:pre-line;
  font-size:14px;
  overflow:hidden
}

.template strong{
  color:#fff
}

.copy-btn{
  position:absolute;
  right:12px;
  top:12px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.14);
  color:#fff;
  border-radius:9px;
  padding:7px 10px;
  cursor:pointer;
  font-size:12px;
  font-weight:800
}

.decision-flow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin:16px 0
}

.flow-item{
  padding:17px;
  background:#fff;
  border-radius:14px;
  border:1px solid var(--line)
}

.flow-item strong{
  display:block
}

.flow-item small{
  color:var(--muted)
}

.checklist{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px
}

.check-group{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px
}

.check-group h3{
  margin-top:0
}

.check-item{
  display:flex;
  gap:11px;
  padding:10px 0;
  border-top:1px solid #eef2f6;
  font-size:14px;
  align-items:flex-start
}

.check-item:first-of-type{
  border-top:0
}

.check-item input{
  width:18px;
  height:18px;
  accent-color:var(--blue2);
  margin-top:2px
}

.support-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.support-card{
  border-radius:16px;
  padding:20px;
  background:#fff;
  border:1px solid var(--line)
}

.support-card span{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.11em;
  color:var(--blue2);
  font-weight:900
}

.support-card strong{
  display:block;
  margin:7px 0 4px
}

.support-card p{
  font-size:13px;
  color:var(--muted);
  margin:0
}

.ref-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}

.ref-card{
  position:relative;
  display:flex;
  gap:12px;
  text-decoration:none;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 38px 14px 14px;
  transition:.2s
}

.ref-card:hover{
  border-color:#8bdcff;
  transform:translateY(-1px)
}

.ref-num{
  font-size:11px;
  color:var(--blue2);
  font-weight:900;
  padding-top:2px
}

.ref-card strong{
  font-size:14px
}

.ref-card p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px
}

.external{
  position:absolute;
  right:13px;
  top:12px;
  color:#7f94a4
}

.footer{
  margin-top:80px;
  border-radius:28px;
  background:var(--navy);
  color:#d1e0ea;
  padding:36px
}

.footer strong{
  color:#fff
}

.footer-grid{
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:30px
}

.footer small{
  color:#8ca3b4
}

.hidden-search{
  display:none!important
}

.search-empty{
  display:none;
  background:#fff4e5;
  border:1px solid #f2d49c;
  border-radius:16px;
  padding:18px;
  margin-top:18px
}

.mobile-menu{
  display:none
}

@media(max-width:1080px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .hero-mini{display:none}
  .quick-grid{grid-template-columns:repeat(2,1fr)}
  .checklist,.support-grid{grid-template-columns:1fr 1fr}
  .mobile-menu{display:inline-flex}
}

@media(max-width:760px){
  .header-inner{padding:0 14px;height:68px}
  .brand-label{display:none}
  .brand img{height:36px}
  .search-wrap{display:none}
  .top-actions .ghost{display:none}
  .layout{padding:18px 14px 60px}
  .hero{padding:34px 24px;min-height:510px;border-radius:24px}
  .hero h1{font-size:48px}
  .hero p{font-size:17px}
  .quick-grid,.grid-2,.grid-3,.checklist,.support-grid,.ref-grid,.decision-flow{
    grid-template-columns:1fr
  }
  .section{padding-top:62px}
  .section-head{align-items:flex-start;flex-direction:column}
  .footer-grid{grid-template-columns:1fr}
  .role-table{font-size:13px}
  .role-table th,.role-table td{padding:11px 8px}
}

@media print{
  .site-header,.sidebar,.hero-actions,.progress-top,.copy-btn{
    display:none!important
  }
  .layout{
    display:block;
    max-width:none;
    padding:0
  }
  .hero{
    box-shadow:none;
    min-height:auto;
    border-radius:0
  }
  .section{
    break-inside:avoid;
    padding-top:28px
  }
  body{background:#fff}
  details{break-inside:avoid}
  details > *{display:block!important}
}

/* V3 — refinamento visual do Guia do Gestor */

  --navy:#041526;
  --navy-deep:#03111f;
  --navy-card:#071d33;
  --blue:#1aa9f4;
  --blue2:#2678e5;
  --cyan:#58d8ff;
  --ink:#0b1b2b;
  --muted:#607487;
  --bg:#f3f7fa;
  --line:#d9e5ee;
  --shadow:0 20px 56px rgba(4,21,38,.11)
}

body{
  background:linear-gradient(180deg,#f6f9fb 0,#f3f7fa 520px,#f3f7fa 100%)
}

.site-header{
  background:rgba(4,21,38,.96);
  box-shadow:0 8px 28px rgba(2,14,26,.12)
}

.header-inner{
  height:82px;
  gap:22px
}

.brand{
  gap:14px
}

.brand-logo{
  display:block;
  height:42px!important;
  width:auto!important;
  max-width:122px;
  object-fit:contain;
  border-radius:0!important;
  filter:drop-shadow(0 5px 14px rgba(0,0,0,.18))
}

.brand-label{
  border-left:1px solid rgba(255,255,255,.14);
  padding-left:14px;
  font-size:14px
}

.brand-label span{
  color:#65d5ff;
  margin-bottom:2px
}

.manager-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#bdeeff;
  background:rgba(80,211,255,.09);
  border:1px solid rgba(101,213,255,.22);
  border-radius:999px;
  padding:8px 11px;
  font-size:11px;
  font-weight:850;
  white-space:nowrap
}

.manager-badge:before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:#58d8ff;
  box-shadow:0 0 0 4px rgba(88,216,255,.09)
}

.layout{
  padding-top:34px
}

.sidebar{
  top:116px
}

.side-kicker{
  color:#167cc1
}

.side-nav a{
  transition:.18s
}

.side-nav a.active{
  background:linear-gradient(90deg,#fff,#f7fbfe);
  border-left-color:#1aa9f4
}

.sidebar-note{
  background:linear-gradient(145deg,#041526,#0a2948);
  border:1px solid rgba(88,216,255,.10);
  box-shadow:0 12px 32px rgba(4,21,38,.10)
}

.hero{
  min-height:550px;
  background:
    radial-gradient(circle at 79% 16%,rgba(32,161,245,.29),transparent 31%),
    radial-gradient(circle at 15% 90%,rgba(38,120,229,.12),transparent 35%),
    linear-gradient(145deg,#03111f 0%,#061b31 58%,#0a3155 100%);
  border:1px solid rgba(88,216,255,.09);
  box-shadow:0 28px 70px rgba(4,21,38,.16)
}

.hero-kicker{
  display:inline-flex;
  align-items:center;
  background:rgba(88,216,255,.07);
  border:1px solid rgba(88,216,255,.13);
  padding:8px 11px;
  border-radius:999px;
  color:#7be0ff
}

.hero h1{
  max-width:700px
}

.hero p{
  max-width:760px
}

.hero-mini{
  background:rgba(3,17,31,.46);
  border-color:rgba(119,224,255,.15)
}

.section{
  padding-top:76px
}

.section-head{
  padding-bottom:2px
}

.section h2{
  color:#091a2a
}

.pill.essential{
  background:#e2f6ff;
  color:#086c9f;
  border:1px solid #c6ecfc
